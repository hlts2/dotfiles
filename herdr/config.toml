# ── herdr configuration  (~/.config/herdr/config.toml) ──────────────────────
# Keybindings mirror this machine's tmux setup. See `herdr config` / docs for all options.

onboarding = false

# ── Theme: tokyo-night (matches tmux theme) ─────────────────────────────────
[theme]
name = "tokyo-night"

# ── Terminal ────────────────────────────────────────────────────────────────
[terminal]
default_shell = "/bin/zsh"
shell_mode    = "auto"  # login shell on macOS, current behavior elsewhere

# ── Keybindings (mirror this machine's tmux setup) ──────────────────────────
[keys]
prefix = "ctrl+r"  # tmux: set -g prefix C-t

# General
help          = "prefix+?"
settings      = "prefix+s"
detach        = "prefix+q"
reload_config = "prefix+r"

# Tabs (≈ tmux windows)
previous_tab = "prefix+p"
next_tab     = ""           # "n" is bound to the new-tab command below
switch_tab   = "prefix+1..9"

# Panes
focus_pane_left  = "prefix+h"        # tmux: select-pane -L
focus_pane_down  = "prefix+j"        # tmux: select-pane -D
focus_pane_up    = "prefix+k"        # tmux: select-pane -U
focus_pane_right = "prefix+l"        # tmux: select-pane -R
close_pane       = "prefix+x"        # tmux: kill-pane
zoom             = "prefix+z"        # tmux: resize-pane -Z
resize_mode      = "prefix+shift+r"
split_vertical   = ""                # replaced by the prefix+| command below
split_horizontal = ""                # replaced by the prefix+- command below

# Sidebar
toggle_sidebar  = "prefix+e"  # matches tmux-agent-sidebar @sidebar_key
edit_scrollback = ""          # freed so prefix+e can toggle the sidebar

# ── Custom commands ─────────────────────────────────────────────────────────
# Open a new tab / split in the active pane's CWD, then focus it.
[[keys.command]]
key     = "prefix+n"
type    = "shell"
command = "herdr tab create --cwd $HERDR_ACTIVE_PANE_CWD --focus"

[[keys.command]]
key     = "prefix+|"
type    = "shell"
command = "herdr pane split --direction right --cwd $HERDR_ACTIVE_PANE_CWD --focus"

[[keys.command]]
key     = "prefix+-"
type    = "shell"
command = "herdr pane split --direction down --cwd $HERDR_ACTIVE_PANE_CWD --focus"

# ── UI ──────────────────────────────────────────────────────────────────────
[ui]
sidebar_width = 30

[ui.sound]
enabled = false

# ── Session ─────────────────────────────────────────────────────────────────
[session]
# Resume AI-agent panes into their native conversation sessions after a server restart.
resume_agents_on_restore = false

# ── Experimental ────────────────────────────────────────────────────────────
[experimental]
# Keep recent pane screen history across full server restarts.
pane_history = true
allow_nested = true

[advanced]
scrollback_limit_bytes = 10485760
