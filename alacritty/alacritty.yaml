window:
  title: ʕ◔ϖ◔ʔ

  opacity: 0.8

  dimensions:
    columns: 128
    lines: 30

  padding:
    x: 8
    y: 4

scrolling:
  history: 100000

selection:
  save_to_clipboard: true

font:
  normal:
    family: Hack Nerd Font Mono
    style: Regular

  size: 14.0

key_bindings:
- { key: N, mods: Super, action: CreateNewWindow }
- { key: Return, mods: Super, action: ToggleSimpleFullscreen }
- { key: Semicolon, mods: Super, action: IncreaseFontSize }
- { key: Equals, mods: Super, action: DecreaseFontSize }
- { key: C, mods: Super, action: Copy }
- { key: V, mods: Super, action: Paste }
# - { key: Yen, chars: "\x5C" }
# - { key: Yen, mods: Command, chars: "\xb4" }
