[window]
title = "ʕ◔ϖ◔ʔ"
opacity = 0.8
dynamic_padding = true

[window.padding]
x = 8
y = 4

[window.dimensions]
columns = 128
lines = 30

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[font]
size = 12.0

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Alt"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Alt"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Semicolon"
mods = "Alt"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "n"
mods = "Alt"

[colors.primary]
background = "#161821"
foreground = "#d2d4de"

[colors.normal]
black   = "#161821"
red     = "#e27878"
green   = "#b4be82"
yellow  = "#e2a478"
blue    = "#84a0c6"
magenta = "#a093c7"
cyan    = "#89b8c2"
white   = "#c6c8d1"

[colors.bright]
black   = "#6b7089"
red     = "#e98989"
green   = "#c0ca8e"
yellow  = "#e9b189"
blue    = "#91acd1"
magenta = "#ada0d3"
cyan    = "#95c4ce"
white   = "#d2d4de"
