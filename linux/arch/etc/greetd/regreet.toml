# ReGreet configuration
# See README at https://github.com/rharish101/ReGreet#configuration

[background]
path = "/etc/greetd/background.jpg"
fit = "Cover"

[env]
XDG_SESSION_TYPE = "wayland"
XDG_CURRENT_DESKTOP = "sway"
XDG_SESSION_DESKTOP = "sway"
QT_QPA_PLATFORM = "wayland"
QT_STYLE_OVERRIDE = "kvantum"
SDL_VIDEODRIVER = "wayland"
ECORE_EVAS_ENGINE = "wayland-egl"
ELM_ENGINE = "wayland_egl"
_JAVA_AWT_WM_NONREPARENTING = "1"
NO_AT_BRIDGE = "1"
BEMENU_BACKEND = "wayland"
MOZ_ENABLE_WAYLAND = "1"
MOZ_DBUS_REMOTE = "1"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "capitaine-cursors"
font_name = "Noto Sans 12"
icon_theme_name = "Tela-circle"
theme_name = "Nordic-darker"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]
